[project]
name = "soccer-analysis-mvp"
version = "0.1.0"
description = "AI Soccer Broadcast Analysis MVP — Windows desktop application"
requires-python = ">=3.11,<3.13"
readme = "README.md"

dependencies = [
    "pyside6>=6.7,<7.0",
    "av>=12.0",
    "torch>=2.3",
    "opencv-python>=4.9",
    "numpy>=1.26,<2.0",
    "scipy>=1.11,<1.14",
    "onnxruntime-gpu>=1.18; sys_platform == 'win32'",
    "ultralytics>=8.2",
    "timm>=1.0",
    "torchvision>=0.18",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-qt>=4.4",
    "pyinstaller>=6.6",
    "ruff>=0.4",
]

[project.scripts]
soccer-analysis = "apps.desktop.startup.main:main"

[tool.pytest.ini_options]
qt_api = "pyside6"
testpaths = ["tests"]
# Soak tests take minutes; excluded from the default run, opted into with
# `pytest -m soak` (or `make soak`).
addopts = "-m 'not soak'"
markers = [
    "soak: long-running stability/memory tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "core*", "video*", "vision*", "ai*", "analysis*", "offside*", "storage*", "observability*", "tools*"]
